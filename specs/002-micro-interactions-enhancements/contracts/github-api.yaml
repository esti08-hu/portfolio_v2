openapi: 3.0.3
info:
  title: GitHub API Integration for Portfolio
  version: 1.0.0
  description: API contract for GitHub statistics integration

servers:
  - url: https://api.github.com
    description: GitHub API v3

paths:
  /users/{username}:
    get:
      summary: Get user profile information
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile data
          content:
            application/json:
              schema:
                type: object
                properties:
                  login:
                    type: string
                  public_repos:
                    type: integer
                  followers:
                    type: integer
                  following:
                    type: integer

  /users/{username}/repos:
    get:
      summary: Get user repositories
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [created, updated, pushed, full_name]
            default: created
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    language:
                      type: string
                    updated_at:
                      type: string
                      format: date-time

  /users/{username}/events:
    get:
      summary: Get user activity events
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: List of user events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    created_at:
                      type: string
                      format: date-time